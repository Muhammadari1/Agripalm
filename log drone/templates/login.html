<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Agripalm Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #1a1d23; color: #e0e0e0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #2c3e50; border-radius: 16px; padding: 40px;
            width: 380px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .login-card .logo {
            font-size: 32px; color: #e67e22; margin-bottom: 4px;
        }
        .login-card h2 {
            color: #fff; font-size: 18px; margin-bottom: 4px;
        }
        .login-card .subtitle {
            color: #7f8c8d; font-size: 12px; margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 16px; text-align: left;
        }
        .form-group label {
            display: block; color: #7f8c8d; font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
        }
        .form-group input {
            width: 100%; padding: 12px 14px; background: #1a252f;
            border: 1px solid #34495e; border-radius: 8px;
            color: #e0e0e0; font-size: 14px;
        }
        .form-group input:focus {
            outline: none; border-color: #e67e22;
        }
        .btn-login {
            width: 100%; padding: 12px; background: #e67e22;
            border: none; border-radius: 8px; color: #fff;
            font-size: 15px; font-weight: 600; cursor: pointer;
            margin-top: 8px; transition: background 0.2s;
        }
        .btn-login:hover { background: #d35400; }
        .error {
            background: #e74c3c22; border: 1px solid #e74c3c44;
            color: #e74c3c; padding: 10px; border-radius: 8px;
            margin-bottom: 16px; font-size: 13px;
        }
        .footer {
            margin-top: 24px; color: #7f8c8d; font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">&#9830;</div>
        <h2>AGRIPALM VISION</h2>
        <div class="subtitle">Server Dashboard — Admin Only</div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('dashboard_login') }}">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Username admin" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="footer">&copy; 2026 PT Bumitama Gunajaya Agro</div>
    </div>
</body>
</html>
